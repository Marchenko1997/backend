services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: django
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d django"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./myapp
      dockerfile: Dockerfile.prod
    image: web_prod:1.0.0
    command: sh -c "python wait_for_db.py && python manage.py migrate && gunicorn app.wsgi:application --bind 0.0.0.0:8000 --access-logfile '-'"
    expose:
      - 8000
    volumes:
      - media_volume:/usr/src/myapp/media
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
    secrets:
      - pg_password
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine-slim
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - static_volume:/app/static
      - static_api_volume:/app/api-static
      - media_volume:/app/media
    ports:
      - 8005:80
    depends_on:
      - web

  api:
    build: ./api
    image: api_prod:1.0.0
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8001 --access-logfile '-'
    expose:
      - 8001
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
    volumes:
      - static_api_volume:/usr/src/myapp/static
      - media_volume:/usr/src/myapp/media
    secrets:
      - pg_password
    restart: unless-stopped # no, always, on-failure: 5, unless-stopped
    depends_on:
      - db

secrets:
  pg_password:
    file: ./secrets/pg_password

volumes:
  data:
  static_volume:
  static_api_volume:
  media_volume:

