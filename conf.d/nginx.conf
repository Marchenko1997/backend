upstream app {
    server web:8000;
    
}

upstream api {
    server api:8001;
    
}

server {
    listen 80;
    server_name 13.51.86.194 ec2-13-51-86-194.eu-north-1.compute.amazonaws.com;

    # ===== Проксирование всех запросов к Django =====
    location / {
        proxy_pass http://app;

        # Передаёт реальный IP клиента
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Передаёт оригинальный Host
        proxy_set_header Host $host;

        # Передаёт информацию о протоколе (http/https)
        proxy_set_header X-Forwarded-Proto $scheme;

        # Отключает автоматическое переписывание редиректов
        proxy_redirect off;
    }

    location /api/ {
        proxy_pass http://api;
        
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header Host $host;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # ===== Обслуживание static файлов =====
    location /static/ {
        # Путь соответствует volume: static_volume:/app/static
        alias /app/static/;

        # Разрешает публичное кэширование
        add_header Cache-Control "public, no-transform";
    }

    # ===== Обслуживание media файлов =====
    location /media/ {
        # Путь соответствует volume: media_volume:/app/media
        alias /app/media/;

        add_header Cache-Control "public, no-transform";
    }

    location /api-static/ {
        # Путь соответствует volume: static_volume:/app/static
        alias /app/api-static/;

        # Разрешает публичное кэширование
        add_header Cache-Control "public, no-transform";
    }

    # ===== Обслуживание media файлов =====
    location /api-media/ {
        # Путь соответствует volume: media_volume:/app/media
        alias /app/media/;

        add_header Cache-Control "public, no-transform";
    }
}
