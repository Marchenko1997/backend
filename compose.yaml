services:
  db:
    image: postgres:17-bookworm
    container_name: db
    restart: unless-stopped #no, always, on-failure: 5, unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Ukraine2018!
      POSTGRES_DB: django
    volumes:
      - data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d django"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: ./myapp
    image: web:1.0.0
    container_name: web
    command: sh -c "python wait_for_db.py && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    develop:
      watch:
        - action: sync
          path: ./myapp
          target: /usr/src/myapp
          ignore:
            - node_modules/
            - venv/
        - action: rebuild
          path: ./myapp/requirements.txt
        - action: rebuild
          path: ./myapp/entrypoint.sh
    restart: unless-stopped #no, always, on-failure: 5, unless-stopped
    env_file:
      - ./myapp/.env.dev
    depends_on:
      db:
        condition: service_healthy

  db_browser:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
  api:
    build: ./api
    image: api:1.0.0
    container_name: api

    command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "127.0.0.1:9000:8000"

    env_file:
      - ./api/.env.dev

    develop:
      watch:
        - action: sync
          path: ./api
          target: /usr/src/myapp

        - action: rebuild
          path: ./api/requirements.txt

    restart: unless-stopped  # no, always, on-failure:5, unless-stopped

    depends_on:
      - db

volumes:
  data: